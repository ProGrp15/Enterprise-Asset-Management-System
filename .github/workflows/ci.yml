name: AssetFlow CI

on:
  push:
    branches: [main, Pushkar]
  pull_request:
    branches: [main, Pushkar]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: assetflow_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize canonical database
        run: mysql --host=127.0.0.1 --user=root --password=root < database/p15_createdb.sql
      - name: Seed roles
        run: |
          mysql --host=127.0.0.1 --user=root --password=root assetflow_db <<'SQL'
          INSERT INTO roles (role_name, description) VALUES
            ('SUPER_ADMIN', 'Platform owner'),
            ('COMPANY_ADMIN', 'Company administrator'),
            ('EMPLOYEE', 'Company employee');
          SQL
      - name: Run Maven tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/assetflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          APP_JWT_SECRET: ci-only-AssetFlow-secret-change-before-deploy
          APP_SUPERADMIN_PASSWORD: ci-only-SuperAdmin@12345
          EUREKA_URL: http://127.0.0.1:8761/eureka/
        run: mvn -q test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0
      - name: Production build
        working-directory: frontend
        run: npm run build
